[package]
name = "opentimetable-solver-core"
version = "0.1.0"
edition = "2021"
description = "High-performance constraint satisfaction and optimization timetable solver engine"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "solver_bench"
harness = false
